[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kowebtoon"
version = "0.1.1"
description = "Webtoons to e-ink friendly CBZs for KOReader, with panel maps for webtoon.koplugin"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["requests>=2.25", "Pillow>=10.1", "numpy>=1.21"]

[project.scripts]
kowebtoon = "kowebtoon.cli:main"

[project.urls]
Homepage = "https://github.com/binoy-d/koreader-webtoon"

[tool.setuptools]
packages = ["kowebtoon"]
